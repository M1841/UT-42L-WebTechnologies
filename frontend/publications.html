<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script>
      (function() {
        var theme = localStorage.getItem("theme");
        if (!theme) {
          // Default to dark, but allow light via system preference
          theme = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>

    <link rel="stylesheet" href="src/styles/styles.css" />

    <!-- https://app.unpkg.com/vue@3.5.30/files/dist -->
    <script src="lib/vue/3.5.30/dist/vue.global.js"></script>

    <!-- https://use.fontawesome.com/releases/v5.15.4/fontawesome-free-5.15.4-web.zip -->
    <link rel="stylesheet" href="lib/fontawesome/5.15.4/css/all.css" />

    <script src="src/i18n.js"></script>

    <title>DeSy - Publications</title>
  </head>
  <body>
    <main id="app">
      <app-header></app-header>

      <app-publications-search></app-publications-search>

      <app-footer></app-footer>
    </main>

    <script src="src/app.js"></script>

    <script src="src/components/shared/Footer.js"></script>
    <script src="src/components/shared/Header.js"></script>
    <script src="src/components/publications/PublicationsSearch.js"></script>

    <script>
      app.mount("#app");
    </script>
  </body>
</html>
