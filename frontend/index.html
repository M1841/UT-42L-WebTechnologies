<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script>
      (function() {
        var theme = localStorage.getItem("theme");
        if (!theme) {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        if (theme === "dark") {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>

    <link rel="stylesheet" href="src/styles/styles.css" />

    <!-- https://app.unpkg.com/vue@3.5.30/files/dist -->
    <script src="lib/vue/3.5.30/dist/vue.global.js"></script>

    <!-- https://use.fontawesome.com/releases/v5.15.4/fontawesome-free-5.15.4-web.zip -->
    <link rel="stylesheet" href="lib/fontawesome/5.15.4/css/all.css" />

    <script src="src/i18n.js"></script>

    <title>DeSy</title>
  </head>
  <body>
    <main id="app">
      <app-header></app-header>

      <app-gallery></app-gallery>
      <app-areas></app-areas>
      <app-team-cards></app-team-cards>
      <app-publications-search-small> </app-publications-search-small>
      <app-projects></app-projects>
      <app-offer></app-offer>

      <app-footer></app-footer>
    </main>

    <script src="src/app.js"></script>

    <script src="src/components/shared/Footer.js"></script>
    <script src="src/components/shared/Header.js"></script>

    <script src="src/components/home/Areas.js"></script>
    <script src="src/components/home/Gallery.js"></script>
    <script src="src/components/home/TeamCardLarge.js"></script>
    <script src="src/components/home/TeamCards.js"></script>
    <script src="src/components/home/PublicationsSearchSmall.js"></script>
    <script src="src/components/home/Projects.js"></script>
    <script src="src/components/home/Offer.js"></script>

    <script>
      app.mount("#app");
    </script>
  </body>
</html>
