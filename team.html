<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="src/styles/styles.css" />

    <!-- https://app.unpkg.com/vue@3.5.30/files/dist -->
    <script src="lib/vue/3.5.30/dist/vue.global.js"></script>

    <!-- https://use.fontawesome.com/releases/v5.15.4/fontawesome-free-5.15.4-web.zip -->
    <link rel="stylesheet" href="lib/fontawesome/5.15.4/css/all.css" />

    <title>DeSy - Team</title>
  </head>
  <body>
    <main id="app">
      <app-header :data="header"></app-header>

      <app-team-director
        :director="team.director"
        :publications="publications"
      ></app-team-director>
      <app-team-member-cards
        :members="team.professors"
        title="Professors"
        member-title="Prof. Eng."
        :has-phd="true"
      ></app-team-member-cards>
      <app-team-member-cards
        :members="team.phdStudents"
        title="PhD Students"
        member-title="Eng."
      ></app-team-member-cards>

      <app-footer :data="footer"></app-footer>
    </main>

    <script src="data/data.js"></script>
    <script src="src/app.js"></script>

    <script src="src/components/shared/Footer.js"></script>
    <script src="src/components/shared/Header.js"></script>
    <script src="src/components/team/TeamDirector.js"></script>
    <script src="src/components/team/TeamMemberCards.js"></script>

    <script src="src/router.js"></script>

    <script>
      app.mount("#app");
    </script>
  </body>
</html>
